# Tool configuration only. The project is run from a checkout and is not
# built as a distributable package; dependencies live in requirements*.txt.
[project]
name = "pantrysense"
version = "1.0.1"
description = "Local recipe recommender: hybrid BM25 + FAISS retrieval with a learned ranker"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: takes more than a few seconds (training, large index builds)",
    "requires_data: needs the real dataset in data/ (recipes.db); skipped when absent",
    "requires_models: needs built artifacts in data/ (vector index, BM25 index, ranker model); skipped when absent",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is not enforced yet
    "B008",  # FastAPI uses calls in argument defaults (Depends, Query)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
