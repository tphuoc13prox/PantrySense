name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt | cut -d' ' -f1)"
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        # The CPU-only torch index keeps sentence-transformers from pulling
        # in the multi-gigabyte CUDA wheels.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - name: Pytest
        # data/ is not part of the checkout, so tests marked requires_data or
        # requires_models skip themselves (see tests/conftest.py).
        run: python -m pytest -m "not slow"
      - name: Mypy
        # Runs here rather than in the lint job so third-party packages and
        # their stubs (faiss-cpu ships its own) are installed. Once is enough.
        if: matrix.python-version == '3.12'
        run: python -m mypy

  e2e-smoke:
    # A fresh checkout end to end: setup on an empty data folder with a small
    # row limit, then a search against the running server. Once with the
    # MiniLM fallback, once with the models from the GitHub release.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PARQUET_CACHE: ${{ github.workspace }}/../smoke-cache
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/../smoke-cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Cache the dataset and embedding downloads
        # The parquet is about 230 MB from Hugging Face; caching it keeps the
        # job fast and off the network on most runs. A cache miss runs the
        # same download code as the app.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PARQUET_CACHE }}
            ~/.cache/huggingface
          key: smoke-${{ hashFiles('app/backend/system/dataset_sources.py', 'requirements.txt') }}
      - name: Download the dataset
        run: |
          PANTRYSENSE_DATA_DIR="$PARQUET_CACHE" python -c "from app.backend.system.dataset_sources import download_full_hf_parquet_file as d; print(d())"
          for dir in minilm e5; do mkdir -p "$RUNNER_TEMP/$dir" && cp "$PARQUET_CACHE/food_recipes.parquet" "$RUNNER_TEMP/$dir/"; done
      - name: Fallback setup (no pretrained models)
        run: python scripts/smoke_test.py --data-dir "$RUNNER_TEMP/minilm" --limit 2000 --expect minilm
      - name: Full setup (fetch-models, e5 and LTR)
        run: |
          python tasks.py fetch-models --data-dir "$RUNNER_TEMP/e5"
          python scripts/smoke_test.py --data-dir "$RUNNER_TEMP/e5" --limit 2000 --expect e5
