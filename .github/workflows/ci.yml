name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt | cut -d' ' -f1)"
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        # The CPU-only torch index keeps sentence-transformers from pulling
        # in the multi-gigabyte CUDA wheels.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - name: Pytest
        # data/ is not part of the checkout, so tests marked requires_data or
        # requires_models skip themselves (see tests/conftest.py).
        run: python -m pytest -m "not slow"
      - name: Mypy
        # Runs here rather than in the lint job so third-party packages and
        # their stubs (faiss-cpu ships its own) are installed. Once is enough.
        if: matrix.python-version == '3.12'
        run: python -m mypy
